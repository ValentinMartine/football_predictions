name: Regenerate world cup predictions

on:
  # Tournoi terminé le 19/07/2026 : la régénération toutes les 2 heures ne produisait plus que des
  # commits d'horodatage. Lancement manuel seulement.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regenerate-worldcup
  cancel-in-progress: false

defaults:
  run:
    working-directory: world_cup

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download latest data
        run: |
          python scripts/download_fifa_rankings.py
          python scripts/download_match_data.py
          python scripts/download_worldcup_metadata.py

      # Résultats live via l'API football-data.org (gratuite, fonctionne en CI).
      # C'est ce qui rend le site « live » quand le PC local est éteint.
      - name: Patch live results from football-data.org
        env:
          FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
        run: python scripts/patch_wc_results_from_football_data.py

      # Résultats live depuis Sofascore pour les matchs pas encore publiés par martj42.
      # Best-effort (scraper navigateur) : non bloquant si l'IP du runner est filtrée.
      - name: Patch live results from Sofascore (best effort)
        continue-on-error: true
        timeout-minutes: 6
        run: |
          pip install ScraperFC botasaurus || true
          python scripts/patch_wc_results_from_sofascore.py || echo "Patch Sofascore ignoré (scraper indisponible en CI)."

      - name: Train model and export predictions
        run: |
          python scripts/train_and_backtest.py
          python -m src.export

      - name: Build bracket and Monte Carlo
        run: |
          python scripts/build_wc_bracket.py
          python scripts/montecarlo_wc.py

      # Compositions via ScraperFC (navigateur headless) : best-effort, non bloquant.
      - name: Refresh lineups (best effort)
        continue-on-error: true
        timeout-minutes: 12
        run: |
          pip install ScraperFC botasaurus || true
          python scripts/fetch_wc_lineups.py || echo "Lineups fetch skipped (scraper indisponible en CI)."

      - name: Commit regenerated data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/predictions.json data/wc_bracket.json data/wc_montecarlo.json data/worldcup_lineups.json
          if git diff --cached --quiet; then
            echo "No prediction changes."
          else
            git commit -m "Regenerate world cup predictions"
            git pull --rebase origin main
            git push
          fi
