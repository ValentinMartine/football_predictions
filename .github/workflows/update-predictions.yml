name: Update predictions

on:
  schedule:
    - cron: "20 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Regenerate predictions
        run: python scripts/update_pipeline.py

      - name: Commit updated predictions
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/predictions.json data/understat_stats.json data/lineups.json data/national_player_form.json \
                  data/team_power.json data/club_logos.json data/standings.json data/bigfive_team_stats.json \
                  data/bigfive_player_extra.json data/other_leagues.json data/other_leagues_matches.json \
                  data/other_leagues_lineups.json data/team_market.json
          if git diff --cached --quiet; then
            echo "No prediction changes."
          else
            git commit -m "Update football club predictions"
            git push
          fi
